# Who they are. Temperament: -2 to +2. Needs: 0 to 2, and any not listed is 1.
# Standing is where they sit in society: wealth, status and power, each -2 to +2. It is the facet they stand for.
# Craft is which kinds of obstacle they can get past: people, locks, systems, movement, paper.
profile:
  temperament: {drive: 1, caution: 1, dominance: -1, warmth: -1}
  needs: {belonging: 2, esteem: 2}
  standing: {wealth: 0, status: -2, power: 1}
  craft: [systems]
  tells_self: responsibility        # how they excuse it: injury, victim, condemners, loyalties, responsibility
