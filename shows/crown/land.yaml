  lode:   {at: [460, 132], entity: long-needle, at_bar: 2.2}
  mallet: {at: [236, 330], entity: sledge, at_bar: 4.4}
  hasp:   {at: [700, 446], entity: heavy-lock, at_bar: 7.6}
