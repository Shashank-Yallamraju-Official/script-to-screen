# The land, as the title sequence travels it. North is outward and south is inward; west is Mallet's side and east is
# Hasp's. Positions are on a sheet 920 wide and 840 tall. `at_bar` is the bar of the anthem on which a place rises;
# a place without one is not visited in this sequence, and stays dark.
bars: 20
# The model's colours: a gold sheet on a deep indigo table, with a blue wall and bright cogs.
