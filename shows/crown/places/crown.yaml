# The crown: the council chamber, built like a colosseum of pale stone, open to the sky and grown over. Solarpunk: light,
# living, and made to last. Bare on purpose: everything in the room means something.
#   the arches, and the sky in them   the hour. Here the sun is low and gold: the end of a long day
#   vines over the arches             the building has been lived in for a long time
#   two grown trees                   so has the council
#   the bench and its plates          a council, each member at its own seat
#   the flag, under the crown         who rules: Signet
name: The crown
