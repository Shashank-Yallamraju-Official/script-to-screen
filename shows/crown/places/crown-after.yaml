# The crown, rebuilt exactly as it was, in new stone. Bare on purpose: the only things that differ are the things that changed.
#   the sky in the arches      the hour. A pale sun, low on the other side: early, and cold
#   no vines                   the stone is new; nothing has had time to grow on it
#   saplings in the planters   the trees were lost, and not long ago
#   three flags                who rules now: Mallet, Signet and Hasp
