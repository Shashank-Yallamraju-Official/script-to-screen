# Settings for the whole show.
schema: 1           # the file format; the engine refuses a show written for a different one
width: 1280
height: 720
fps: 60

# The tempo grid. Every timing in a scene is counted in steps, so pauses, holds and syllables
# land on the beat. At 120 beats per minute with 4 steps per beat, one step is an eighth of a
# second. A scene can set its own `tempo`. Fractions of a step are allowed for fine nudges.
tempo: 120
steps_per_beat: 4
scale: [0, 2, 4, 7, 9]      # the notes voices sing in, as semitones above the voice's own pitch

# The felt states every entity shares. Colours appear only in the director's x-ray view.
emotions: {fear: "#7b5ea7", anger: "#c8372d", sadness: "#4a6fa5", joy: "#e0a01e", shame: "#d6457a", surprise: "#2f9e8f"}

# Position in the room. weight = status on my side / status of everyone who has taken a side.
# How many tells show = felt intensity x gain, where gain = slope x weight, kept within min..max.
# At equal weight (0.5) the gain is 1: what is felt is what shows.
gain: {slope: 2.0, min: 0.34, max: 1.5}

# Steps. pause = before a line starts; hold = after a turn finishes; settle = a turn with no line.
# bubble_break = a pause this long or longer inside a line starts a new bubble. A full stop is a
# pause of 2 and a comma of 1, so by default sentences get their own bubbles and clauses do not.
timing: {pause: 2, hold: 8, settle: 4, bubble_break: 2}

# A tell counts as learned by the audience once it has shown in this many separate scenes.
ledger: {learn_after: 3}
