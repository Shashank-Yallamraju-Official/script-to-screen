kind: person        # free text, never drawn. An entity is anything that can think, act and feel.
color: "#d95f43"
voice: 392          # the pitch of its voice in Hz; add `timbre: sine | tri | square`
status: 1           # standing in a room; a scene can override it
reflex: 0           # steps it takes to react to something said (0 is instant)
# How each feeling leaks out, in order. The first entry is the last to be suppressed.
# Channels: attention (down, up, viewer, source, away), orient (toward, away, out),
# distance (slots: negative approaches, positive retreats), posture (contracted, lean_in,
# lean_back), tone (see library/tones.yaml), latency (extra steps before speaking).
tells:
  joy:   [{tone: teasing}, {posture: lean_in}, {distance: -1}]
  anger: [{tone: deadpan}, {attention: source}, {distance: -1}]
  shame: [{posture: contracted}, {attention: away}, {tone: whisper}]

# Who they are. Temperament dials run -2 to +2; needs run 0 to 2, and any not listed is 1.
# What an event makes them feel is worked out from this (see docs/lld-profiles.md).
profile:
  temperament: {drive: 1, caution: -1, dominance: 2, warmth: 0}
  needs: {control: 2}
