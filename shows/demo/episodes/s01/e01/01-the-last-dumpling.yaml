# A turn changes as little as possible and says why. Everything else holds.
#   enter / exit   who is present, and at which of the nine slots (0 left .. 8 right)
#   side, status   who stands with whom, and how much standing they have
#   do             a deliberate action: slot, move, orient, attention, posture
#   who, say       the speaker and the line; the tone comes from what the speaker feels
#                  (write `sing:` in place of `say:` for a sung line, which shows a music note)
#                  one bubble holds one beat: a line breaks into bubbles wherever there is a
#                  pause (full stop, ? or !), or write a list to choose: say: [Ha, ha, ha]
#   feel           what the turn makes entities feel: {entity: {emotion: 1-3}} or {entity: calm}
#   react          reactions to the line, each {who, feel and/or do}. Two kinds:
#                    in passing  {who: otis, word: dumpling, feel: {shame: 2}}   fires on that word; the scene runs on
#                    featured    {who: otis, feel: {shame: 3}, beat: 6}         takes the floor; the scene waits 6 steps
#                  a `do` inside a reaction is a take: it lasts for the moment, then is dropped
#   pause, hold    steps before the line and after the turn (tune these in the editor)
#   rhythm, melody one entry per syllable: its length in steps, its pitch in semitones
#   stress         one entry per syllable: 0 weak, 1 strong, 2 the phrase's main accent
#   sfx            sounds placed by hand: [{at: 4, sound: thud}]
# Write a middle dot inside a word (some·one) to say where its syllables break, and a caret
# before the syllable that should be strong (to^day).
# Scenes run in path order: episodes/<season>/<episode>/<scene>.yaml. What entities feel, and
# their status, carry into the next scene. To change that, the next scene opens with
#   offscreen: [{feel: {otis: calm}, why: A night's sleep.}]
scene: The last dumpling
place: kitchen
# What is true, who did it, and who knows. Feelings below are worked out from `event:` and the entities' profiles.
facts:
  dumpling: {doer: otis, knows: [otis, juno]}
turns:
  - id: 1
    enter: {juno: {slot: 2}, otis: {slot: 5}}
    regard: {otis: {plate: {shame: 2}}}      # from now on: named or approached, the plate brings this up in him. It carries into later scenes.
    why: Two entities share a room at social distance, both facing out. Nothing has happened yet.

  - id: 2
    who: juno
    do: {juno: {orient: otis}}
    say: Some·one ate the last dumpling.
    event: {kind: threat, need: esteem, size: 2, by: juno, target: otis, fact: dumpling, accuses: true}
    react:
      - {who: otis, word: dumpling}
    why: She already knows, and enjoys knowing. His eyes drop on the word itself, before she has finished.

  - id: 3
    who: otis
    say: It was like that when I got here.
    why: The lie. He does not turn to her, because facing her would be answering her.

  - id: 4
    who: juno
    do: {juno: {move: {toward: otis, zone: personal}}}
    say: There's sauce on your chin.
    event: {kind: loss, need: esteem, size: 3, by: juno, target: otis, fact: dumpling, accuses: true}
    react:
      - {who: otis, beat: 6}
    why: She closes the distance to apply pressure, then gives the proof. His turning away is the moment, so the scene stops for it.

  - id: 5
    why: Nobody speaks. The silence is the verdict.
    hold: 12
