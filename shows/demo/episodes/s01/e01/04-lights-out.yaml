scene: Lights out
place: kitchen-night
facts:
  dial: {doer: bix, knows: [bix]}
# The tag. Juno has gone to bed without an answer about the thermostat, and the two suspects
# are alone for the first time all day.
offscreen:
  - feel: {juno: calm, otis: calm}
    event: {kind: loss, need: esteem, size: 2, by: bix, target: otis, unseen: true}
    why: Hours later. Juno gave up and went to bed. Bix has been carrying the thermostat alone, and Otis took the blame for it without knowing.
turns:
  - id: 1
    enter: [otis]      # nobody's place is written in this scene: Otis is found by the fridge, which serves his comfort
    why: Otis is in the kitchen in the dark, by the fridge, because that is where the dumplings are kept.

  - id: 2
    enter: {bix: {from: left, orient: otis}}
    side: {otis: suspects, bix: suspects}
    why: Bix rolls in. It has come to say something and has not worked out how to start.
    hold: 6

  - id: 3
    who: otis
    do: {otis: {orient: bix}}
    say: You told on me.
    why: The vase. He has been waiting all day to say it, and now there is nobody to hear it but Bix.

  - id: 4
    who: bix
    say: You ate the dumpling.
    why: A fair point, and Bix makes it without moving. It is easier than what it came to say.

  - id: 5
    who: otis
    say: That was a diff·erent day.
    why: His whole defence. He believes it.
    hold: 4

  - id: 6
    why: Neither of them speaks. Bix is deciding.
    hold: 14

  - id: 7
    who: bix
    say: I touched the thermostat.
    event:
      - {kind: loss, need: esteem, size: 2, by: bix, target: bix, fact: dial, reveals: true}
      - {kind: relief, need: esteem, size: 2, by: bix, target: otis}
    react:
      - {who: otis, beat: 8}
    why: The confession. Bix backs away as it says it. Otis took the blame for this an hour ago, and he is delighted, so the scene stops for him.

  - id: 8
    who: otis
    say: Eighty degrees!
    why: He is quoting Juno, and enjoying it far too much.

  - id: 9
    who: bix
    say: It was an ac·ci·dent.
    why: Small, and from across the room.
    hold: 6

  - id: 10
    who: otis
    do: {otis: {move: {toward: bix, zone: personal}}}
    say: Vases fall.
    event: {kind: relief, need: belonging, size: 1, by: otis, target: bix}
    why: He crosses the room and hands Bix his own excuse from this morning. It is the nearest he gets to forgiving anyone.
    hold: 10

  - id: 11
    enter: {juno: {orient: otis}}      # through the door
    side: {juno: owner}
    event: {kind: threat, need: safety, size: 2, by: juno, target: [otis, bix]}
    why: Juno is in the doorway. Nobody heard her come down.
    hold: 6

  - id: 12
    who: juno
    say: I can hear you both.
    event: {kind: gain, need: control, size: 1, target: juno, fact: dial}
    why: She has known all along, and she is enjoying it, exactly as she enjoyed the dumpling.

  - id: 13
    why: Nobody moves. The day ends where it started.
    hold: 14
