scene: The vase
place: hallway
facts:
  vase: {doer: otis, knows: [otis, bix]}
offscreen:
  - feel: {otis: calm, juno: calm}
    why: A day has passed. The dumpling is forgiven, or at least not mentioned.
turns:
  - id: 1
    enter: {juno: {slot: 2}, bix: {slot: 3}, otis: {slot: 6}}
    side: {juno: owners, bix: owners, otis: suspect}
    why: Juno and Bix arrive as a pair; Otis is across the room. It is two against one before anyone speaks.

  - id: 2
    who: juno
    do: {juno: {orient: otis}, bix: {orient: otis}}
    say: The vase was fine this morning.
    event: {kind: threat, need: esteem, size: 2, by: juno, target: otis, fact: vase, accuses: true}
    feel: {bix: calm}      # worked out: fear 2 for Otis. Overruled, so that Juno and Bix still read as a pair here.
    why: The same accusation at the same strength as the dumpling. The only new thing is that he is outnumbered.

  - id: 3
    who: otis
    say: Vases fall.
    react:
      - {who: bix, word: fall, do: {attention: juno}}
      - {who: juno, do: {attention: viewer}, beat: 8}
    why: Outnumbered, he gives away less. Bix glances at Juno in passing. Then Juno looks straight out at us, and the scene waits for her.

  - id: 4
    who: bix
    say: I saw.
    event: {kind: loss, need: esteem, size: 3, by: bix, target: otis, fact: vase, accuses: true, reveals: true}
    why: The witness speaks. There is nowhere left for the lie to go.

  - id: 5
    why: He holds still. With two watching, even full shame does not turn him away.
    hold: 12
