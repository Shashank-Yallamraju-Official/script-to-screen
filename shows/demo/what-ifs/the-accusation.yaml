# A what-if: one setup, one event, and how everyone would react in each variation.
# Run it with:  s2s what-if shows/demo/what-ifs/the-accusation.yaml
# A variation can change: present, sides, facts, feelings, dials, needs, bonds, event.
name: Juno says someone ate the last dumpling
setup:
  place: kitchen
  present: [juno, otis]
  slots: {juno: 2, otis: 5}            # leave someone out and they stand where their regards put them
  stance: {juno: {orient: otis}}
  line: {who: juno, say: Some·one ate the last dumpling.}
  facts:
    dumpling: {doer: otis, knows: [otis, juno]}
event: {kind: threat, need: esteem, size: 2, by: juno, target: otis, fact: dumpling, accuses: true}
variations:
  - name: Otis didn't do it
    facts: {dumpling: {doer: bix, knows: [bix]}}
  - name: Juno doesn't know
    facts: {dumpling: {knows: [otis]}}
  - name: Bix is there
    present: [juno, otis, bix]
  - name: Bix did it, and is there
    present: [juno, otis, bix]
    facts: {dumpling: {doer: bix, knows: [bix]}}
  - name: Otis outranks her
    dials: {otis: {dominance: 2}}
  - name: Bix backs Otis
    present: [juno, otis, bix]
    sides: {juno: owner, otis: suspects, bix: suspects}
  - name: Otis is already ashamed
    feelings: {otis: [shame, 3, bix]}
