[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "script-to-screen"
version = "0.1.0"
description = "A turn-based animation engine: scenes are data, and every detail has a reason."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["skia-python", "pyyaml", "ruamel.yaml", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
s2s = "script_to_screen.cli:main"
script-to-screen = "script_to_screen.cli:main"

[tool.setuptools]
packages = ["script_to_screen", "script_to_screen.vocabulary", "script_to_screen.script", "script_to_screen.world", "script_to_screen.performance", "script_to_screen.presentation", "script_to_screen.readers", "script_to_screen.commands", "script_to_screen.tools"]

[tool.setuptools.package-data]
"script_to_screen.tools" = ["editor.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
