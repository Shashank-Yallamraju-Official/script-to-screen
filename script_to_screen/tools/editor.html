<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>script-to-screen</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0f1011; --panel:#16171a; --raise:#1d1f23; --line:#292b30; --text:#d0d6e0; --mute:#7f8590; --accent:#6e79d6; --warn:#e5a13a; --bad:#e5534b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 12px/1.3 Inter, -apple-system, "Segoe UI", system-ui, sans-serif; user-select: none; overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; }
  #stage { flex: 1; min-height: 120px; display: flex; align-items: center; justify-content: center; padding: 14px; position: relative; }
  #view { max-width: 100%; max-height: 100%; border-radius: 6px; background: #000; box-shadow: 0 8px 30px #0008; }
  #spin { position: absolute; width: 26px; height: 26px; border: 2px solid #0003; border-top-color: #000; border-radius: 50%; animation: sp .7s linear infinite; display: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; border-radius: 2px; background: var(--line); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--text); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--text); cursor: pointer; }
  #bar { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); }
  #why { flex: 1; min-width: 0; padding: 0 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { all: unset; width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 6px; color: var(--mute); cursor: pointer; position: relative; }
  button:hover { background: var(--raise); color: var(--text); }
  button.on { color: var(--accent); }
  button:disabled { opacity: .3; pointer-events: none; }
  button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #play { color: var(--text); }
  #carry { display: none; cursor: help; }
  #flag { display: none; color: var(--warn); } #flag.bad { color: var(--bad); }
  .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; flex: none; }
  #tc { font: 500 12px ui-monospace, "SF Mono", Menlo, monospace; padding: 0 8px; min-width: 84px; flex: none; }
  #sel { display: none; align-items: center; gap: 6px; padding: 2px 4px 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); flex: none; }
  #sel i { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
  #sel input { all: unset; width: 44px; font: 500 12px ui-monospace, Menlo, monospace; color: var(--text); text-align: right; user-select: text; }
  #ledger { display: flex; gap: 10px; padding: 0 8px; flex: none; }
  .led { display: flex; align-items: center; gap: 5px; } .led > i { width: 9px; height: 9px; border-radius: 50%; }
  .pips { display: flex; gap: 2px; } .pips u { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid; box-sizing: border-box; }
  .own { position: absolute; height: 10px; margin-top: -5px; border-radius: 3px; cursor: pointer; box-sizing: border-box; opacity: .75; }
  .own:hover { opacity: 1; } .own.fixed { cursor: default; opacity: .3; }
  .own.gap { background: repeating-linear-gradient(135deg, #8a90a8 0 2px, transparent 2px 5px); border: 1px solid #8a90a855; }
  .own.sel { opacity: 1; outline: 2px solid #fff; outline-offset: 1px; z-index: 3; }
  #knob { display: none; align-items: center; gap: 7px; padding: 2px 6px 2px 8px; border: 1px solid var(--accent); border-radius: 6px; background: var(--bg); flex: none; }
  #knob > i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  #knob input { all: unset; width: 46px; font: 500 12px ui-monospace, Menlo, monospace; color: var(--text); text-align: right; user-select: text; }
  #knob .sc { display: flex; gap: 3px; cursor: help; } #knob .sc u { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--mute); box-sizing: border-box; }
  #knob .sc u.on { background: var(--mute); } #knob .sc u.hand { border-color: var(--accent); background: var(--accent); }
  #knob button { width: 20px; height: 20px; } #knob button svg { width: 12px; height: 12px; }
  #knob .ab { display: flex; gap: 1px; cursor: pointer; font: 600 10px ui-monospace, Menlo, monospace; color: var(--mute); }
  #knob .ab b { padding: 1px 4px; border-radius: 3px; } #knob .ab b.on { background: var(--accent); color: #fff; }
  #abmark { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); padding: 2px 9px; border-radius: 10px; background: #000a; color: #fff; font: 600 11px ui-monospace, Menlo, monospace; display: none; pointer-events: none; }
  #inplay { display: flex; gap: 2px; flex: none; }
  #inplay button { width: 22px; height: 22px; opacity: .55; } #inplay button:hover { opacity: 1; } #inplay button.on { opacity: 1; color: var(--accent); background: #6e79d622; border-radius: 5px; }
  #inplay button.hand::after { content: ""; position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: -9px 0 0 9px; }
  #inplay svg { width: 13px; height: 13px; } #inplay span { color: var(--mute); font-size: 10px; align-self: center; padding: 0 3px; cursor: help; }
  .turn.orph::before { content: ""; position: absolute; top: 3px; right: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
  #find { display: none; all: unset; display: none; width: 120px; padding: 2px 8px; border: 1px solid var(--accent); border-radius: 6px; background: var(--bg); color: var(--text); font: 12px ui-monospace, Menlo, monospace; user-select: text; }
  #view { cursor: pointer; }
  .cue { position: absolute; width: 0; height: 0; margin: -11px 0 0 -5px; border-left: 5px solid transparent; border-right: 5px solid transparent; cursor: help; z-index: 3; }
  .cue.good { border-bottom: 8px solid #e0a01e; } .cue.bad { border-top: 8px solid #c8372d; margin-top: -11px; }
  .cue.ask { border: 0; width: 7px; height: 7px; margin: -11px 0 0 -3.5px; border-radius: 50%; background: #2f9e8f; }
  #ep { display: flex; gap: 2px; padding: 4px 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 22px; box-sizing: border-box; }
  #ep button { flex-basis: 0; min-width: 26px; height: 18px; padding: 0 6px; display: flex; align-items: center; gap: 5px; overflow: hidden; white-space: nowrap; border-radius: 4px; border: 1px solid var(--line); background: none; color: #7f8590; font: 500 10px Inter, system-ui, sans-serif; cursor: pointer; }
  #ep button svg { width: 11px; height: 11px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  #ep button em { font-style: normal; margin-left: auto; color: #7f8590; } #ep button em.off { color: #e0a43a; }
  #ep button#meter { flex: 0 0 auto; }
  #ep button:hover { color: #d7dae0; } #ep button.here { border-color: #5e6ad2; color: #d7dae0; background: #5e6ad222; }
  #tl { display: flex; background: var(--panel); }
  #gutter { width: 34px; flex: none; position: relative; border-right: 1px solid var(--line); }
  #gutter div { position: absolute; left: 0; width: 100%; display: grid; place-items: center; color: var(--mute); }
  #gutter svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #gutter i { width: 9px; height: 9px; border-radius: 50%; }
  #scroll { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; }
  #track { position: relative; }
  #ruler { position: sticky; left: 0; top: 0; display: block; cursor: ew-resize; z-index: 4; }
  .turn { position: absolute; height: 24px; background: var(--raise); border: 1px solid var(--line); border-radius: 5px; color: var(--mute); padding: 4px 7px; font-weight: 500; overflow: hidden; }
  .turn.cur { border-color: #3d4050; color: var(--text); }
  .grip { position: absolute; top: 0; right: 0; width: 8px; height: 100%; cursor: col-resize; }
  .grip::after { content: ""; position: absolute; right: 2px; top: 5px; bottom: 5px; width: 2px; border-radius: 1px; background: var(--line); }
  .grip:hover::after, .grip.sel::after { background: var(--accent); }
  .cut { position: absolute; width: 1px; background: var(--line); pointer-events: none; }
  .beat { position: absolute; width: 1px; background: #ffffff0a; pointer-events: none; }
  .beat.bar { background: #ffffff12; } .beat.phrase { background: #ffffff38; }
  .fx { position: absolute; height: 18px; margin-top: -9px; border-radius: 5px; cursor: ew-resize; overflow: hidden; z-index: 2; background: #c4871f55; border: 1px solid #c4871f; box-sizing: border-box; color: #f1d9ae; font: 500 10px/16px Inter, system-ui, sans-serif; padding: 0 6px; white-space: nowrap; }
  .fx .fd { position: absolute; top: 1px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: #f1d9ae; cursor: ew-resize; z-index: 3; }
  .ln { position: absolute; height: 18px; margin-top: -9px; border-radius: 5px; overflow: hidden; box-sizing: border-box; pointer-events: none; opacity: .75; color: #fff; font: 500 10px/18px Inter, system-ui, sans-serif; padding: 0 6px; white-space: nowrap; }
  .fx.sel { outline: 2px solid #fff; outline-offset: 1px; }
  .fx .grip.left { left: 0; right: auto; } .fx .grip.left::after { left: 2px; right: auto; }
  .felt { position: absolute; height: 14px; margin-top: -7px; border-radius: 4px; display: flex; align-items: center; padding-left: 5px; overflow: hidden; }
  .rx { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; transform: rotate(45deg); border-radius: 2px; z-index: 3; box-shadow: 0 0 0 2px var(--panel); }
  .rx.hold { height: 20px; margin: -10px 0 0 0; transform: none; border: 2px solid; border-radius: 5px; background: #ffffff14; box-shadow: none; }
  .say { position: absolute; height: 20px; margin-top: -10px; border-radius: 6px; cursor: ew-resize; overflow: hidden; z-index: 2; }
  .say b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px 0 0 6px; }
  .say span { position: absolute; left: 18px; right: 6px; top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #111; font-weight: 500; font-size: 11px; pointer-events: none; }
  .say i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--panel); }
  .say u { position: absolute; left: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff9; pointer-events: none; }
  .note { position: absolute; height: 11px; margin-top: -5.5px; border-radius: 3px; cursor: ns-resize; z-index: 2; font-size: 9px; line-height: 11px; color: #111; padding-left: 3px; overflow: hidden; white-space: nowrap; font-weight: 600; }
  .note.set { outline: 1.5px solid #fff8; outline-offset: -1.5px; }
  .note .ng { position: absolute; top: 0; right: 0; width: 5px; height: 100%; cursor: col-resize; background: #0003; }
  .note.live { outline: 2px solid #fff; }
  .sel { outline: 2px solid #fff; outline-offset: 1px; }
  #head { position: absolute; top: 0; width: 1px; background: var(--accent); pointer-events: none; z-index: 5; }
  #takelist { position: fixed; display: none; flex-direction: column; gap: 4px; padding: 8px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); z-index: 9; min-width: 190px; }
  #takelist div { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line); cursor: pointer; font-size: 12px; }
  #takelist div.here { border-color: #5e6ad2; } #takelist div span { flex: 1; } #takelist div b { font-weight: 400; color: #7f8590; padding: 0 2px; }
  #takelist input { all: unset; padding: 3px 8px; border: 1px solid var(--line); border-radius: 5px; font-size: 12px; color: var(--text); user-select: text; }
  .lv { position: absolute; width: 9px; height: 9px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; border: 2px solid #c4871f; box-sizing: border-box; cursor: grab; z-index: 3; }
  .mark { position: absolute; top: 0; bottom: 0; background: #5e6ad21f; border-left: 1px solid #5e6ad2; border-right: 1px solid #5e6ad2; pointer-events: none; z-index: 1; }
  .wav { position: absolute; left: 0; pointer-events: none; }
  .pin { position: absolute; top: 2px; width: 9px; height: 12px; margin-left: -1px; background: #e0a43a; clip-path: polygon(0 0, 100% 0, 100% 62%, 22% 62%, 22% 100%, 0 100%); cursor: pointer; z-index: 6; }
  .pin.done { background: #5a5f69; }
  #note { all: unset; display: none; width: 260px; padding: 2px 8px; border: 1px solid #e0a43a; border-radius: 6px; background: var(--bg); color: var(--text); font: 12px Inter, system-ui, sans-serif; user-select: text; }
  #toast { position: fixed; left: 14px; bottom: 14px; padding: 8px 12px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); display: none; cursor: pointer; max-width: 60vw; white-space: pre-line; z-index: 9; }
  #toast.bad { border-color: var(--bad); color: var(--bad); }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="view" width="1280" height="720"></canvas><div id="spin"></div><div id="abmark"></div></div>
  <div id="bar">
    <button id="prev"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
    <button id="next"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
    <span class="sep"></span>
    <button id="play" title="Play or pause (Space)"></button>
    <button id="loop" title="Loop (L): the current turn, or, with the knob on a value, the moment around it, with a short gap between passes"><svg viewBox="0 0 16 16"><path d="M3 7V6a2 2 0 0 1 2-2h7M10 2l2 2-2 2M13 9v1a2 2 0 0 1-2 2H4M6 14l-2-2 2-2"/></svg></button>
    <button id="xray" title="X-ray (X): the director's view. Everything below the ground line is for you, not the audience. The bar is an entity's weight in the room. Ringed pips are what it feels; filled pips are what shows."><svg viewBox="0 0 16 16"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg></button>
    <button id="hear"></button>
    <button id="carry"><svg viewBox="0 0 16 16"><path d="M2 8h8M7 5l3 3-3 3M13 3v10"/></svg></button>
    <span id="tc"></span>
    <div id="sel" title="Steps for the selected timing. Type a number, or Alt+arrow to nudge a quarter step."><i></i><input id="selv" type="number" step="0.25"></div>
    <div id="knob"><i></i><input id="knobv" type="number"><span class="sc" id="knobs"></span><button id="kreset"><svg viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 3v3h3"/></svg></button><span class="ab" id="kab"><b>A</b><b class="on">B</b></span><button id="kwide"><svg viewBox="0 0 16 16"><path d="M6 3H3v3M10 3h3v3M6 13H3v-3M10 13h3v-3"/></svg></button></div>
    <input id="find" placeholder="/" title="Find a value by how you would describe it: bouncy, gap, louder, snappy. Enter puts the knob on the best match nearest the playhead; Escape closes."><input id="note" placeholder="note" title="A note pinned to this moment, for the assistant to read. Enter keeps it; with no words, Enter takes the pin away; Escape leaves it as it was."><div id="inplay"></div>
    <span id="why" title="Why this turn happens"></span>
    <div id="ledger"></div>
    <button id="flag"><svg viewBox="0 0 16 16"><path d="M8 2.5 14.5 13h-13zM8 7v3M8 11.6v.1"/></svg></button>
    <span class="sep"></span>
    <button id="undo" title="Undo (Ctrl/Cmd+Z)"><svg viewBox="0 0 16 16"><path d="M5 3 2 6l3 3M2 6h7a4 4 0 0 1 0 8H6"/></svg></button>
    <button id="redo" title="Redo (Ctrl/Cmd+Shift+Z)"><svg viewBox="0 0 16 16"><path d="m11 3 3 3-3 3M14 6H7a4 4 0 0 0 0 8h3"/></svg></button>
    <button id="takes" title="Takes: keep the whole show's tuning as it stands under a name, and switch between takes to compare them. Switching is one undo step."><svg viewBox="0 0 16 16"><path d="M8 2 2 5l6 3 6-3zM2 8l6 3 6-3M2 11l6 3 6-3"/></svg></button>
    <button id="render"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 3v10M11 3v10M2 6h3M2 10h3M11 6h3M11 10h3"/></svg></button>
  </div>
  <div id="ep"></div>
  <div id="tl">
    <div id="gutter"></div>
    <div id="scroll"><div id="track"><canvas id="ruler"></canvas><div id="head"></div></div></div>
  </div>
</div>
<div id="takelist"></div>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const view = $('view'), ctx = view.getContext('2d'), scroll = $('scroll'), track = $('track'), ruler = $('ruler');
const PAD = 14, RULER = 24, ROW = 26, ROLL = 84, WAVE = 40;
const ICON = {
  time: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8.5" r="5"/><path d="M8 6v2.5l2 1.5M6.5 2h3"/></svg>',
  pitch: '<svg viewBox="0 0 16 16"><path d="M6 12.5V4l6-1.2v7.8"/><circle cx="4.3" cy="12.5" r="1.7"/><circle cx="10.3" cy="10.6" r="1.7"/></svg>',
  stress: '<svg viewBox="0 0 16 16"><path d="M4 3l8 4.5L4 12"/></svg>',
  motion: '<svg viewBox="0 0 16 16"><path d="M2 12c2 0 2-8 5-8s3 6 4.5 6S13 8 14 8"/></svg>',
  sound: '<svg viewBox="0 0 16 16"><path d="M3 6h2l3-3v10l-3-3H3zM10.5 5.5a3.5 3.5 0 0 1 0 5"/></svg>',
  tone: '<svg viewBox="0 0 16 16"><path d="M3 3h10v7H8l-3 3v-3H3z"/></svg>',
  entity: '<svg viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.5"/><path d="M3.5 13.5a4.5 4.5 0 0 1 9 0"/></svg>',
  own: '<svg viewBox="0 0 16 16"><path d="M2 5v6M14 5v6M2 8h12M6 6.5v3M10 6.5v3"/></svg>',
  play: '<svg viewBox="0 0 16 16"><path d="M5 3v10l8-5z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 16 16"><path d="M5 3v10M11 3v10" stroke-width="2.4"/></svg>',
  turns: '<svg viewBox="0 0 16 16"><rect x="2" y="4" width="5" height="8" rx="1"/><rect x="9" y="4" width="5" height="8" rx="1"/></svg>',
  say: '<svg viewBox="0 0 16 16"><path d="M3 3h10v7H8l-3 3v-3H3z"/></svg>',
  wave: '<svg viewBox="0 0 16 16"><path d="M2 8v0M4.5 6v4M7 3.5v9M9.5 5.5v5M12 7v2M14 8v0"/></svg>',
  roll: '<svg viewBox="0 0 16 16"><path d="M6 12.5V4l7-1.5V11"/><circle cx="4.2" cy="12.5" r="1.8"/><circle cx="11.2" cy="11" r="1.8"/></svg>',
  feel: '<svg viewBox="0 0 16 16"><path d="M2 12c2 0 2-8 4-8s2 8 4 8 2-5 4-5"/></svg>',
  snd: '<svg viewBox="0 0 16 16"><path d="M3 6h2l3-3v10l-3-3H3zM10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6.5 6.5 0 0 1 0 9"/></svg>',
};
let S = null, F = 0, pps = 12, playing = false, loop = false, stalled = false, xray = false;
let frames = new Map(), selected = null, drag = null, pick = null, picked = null;
let cands = [], pickSpan = null;                       // the values in play at the playhead; and where the picked one shows at work, if it owns no time
let aud = null, audT = 0, side = 'B', A = null;        // aud: the frames being auditioned; side: which build plays; A: the scene as it stood when the value was picked   // pick: the address the knob is on; picked: what the server says about it
let audio = new Audio(), audioRev = -1, muted = false, clock0 = 0, clockBase = 0, range = [0, 0];

const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const toast = (msg, bad, onclick) => {
  const t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block'; t.onclick = onclick || null;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', bad ? 8000 : 5000);
};
// time: the timeline is in steps of the tempo grid; the picture is in frames
const fps = () => S.fps * S.step;                       // frames per step
const stepsOf = f => f / fps(), frameOf = s => Math.round(s * fps());
const x = s => PAD + s * pps;
const turnAt = f => { const s = stepsOf(f) + 1e-6; return S.turns.find(t => s >= t.start && s < t.start + t.length) || S.turns[S.turns.length - 1]; };
const turnFrames = t => [frameOf(t.start), Math.min(S.total, frameOf(t.start + t.length))];
const el = (cls, style, title) => { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, style); if (title) d.title = title; track.appendChild(d); return d; };
const pips = (n, filled, color) => `<span class="pips">${Array.from({ length: n }, (_, i) => `<u style="border-color:${color};background:${i < filled ? color : 'none'}"></u>`).join('')}</span>`;
const num = v => String(Math.round(v * 100) / 100);

// ---- frames: the server renders, the browser keeps what it has seen --------------------------
const loadImg = (f, full, rev, build) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = `/frame?f=${f}&rev=${rev}&full=${full ? 1 : 0}&xray=${xray ? 1 : 0}` + (build ? '&build=' + build : ''); });
function nextNeeded() {
  if (!frames.has(F)) return F;
  const end = playing ? range[1] : Math.min(S.total, F + 3000);

async function showWave() { const rev = S.rev, only = layer; try { const w = await api('/wave?rev=' + rev + hearQ()); if (rev === S.rev && only === layer) { wave = { rev, only, ...w }; build(); } } catch (e) {} }
const showWaveSoon = () => { clearTimeout(waveT); waveT = setTimeout(showWave, 500); };
// ---- level curves: a layer's level, bent over time, drawn over the waveform ----------------------
let waveY = 0, curveEdit = null;                          // curveEdit: the points while one is being dragged
const curveLayer = () => S.card ? (S.card.music ? 'music' : null) : layer;
const lvY = v => waveY - (Math.min(Math.max(v, 0), 2) - 1) * (WAVE / 2 - 3);
function drawCurve() {
  track.querySelectorAll('.lv,.lvl').forEach(d => d.remove());
  const key = curveLayer(); if (!key) return;
  const pts = curveEdit || (S.levels || {})[key] || [];
  const line = pts.length ? [[0, pts[0][1]], ...pts, [S.steps, pts[pts.length - 1][1]]] : [[0, 1], [S.steps, 1]];
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'wav lvl'); svg.setAttribute('width', x(S.steps) + PAD); svg.setAttribute('height', WAVE + 8); svg.style.top = waveY - WAVE / 2 - 4 + 'px';
  svg.innerHTML = `<path fill="none" stroke="#f1d9ae" stroke-width="1.2" ${pts.length ? '' : 'stroke-dasharray="3 4" opacity=".5"'} d="M${line.map(p => `${x(p[0]).toFixed(1)},${(lvY(p[1]) - waveY + WAVE / 2 + 4).toFixed(1)}`).join('L')}"/>`;
  track.appendChild(svg);
  pts.forEach((p, i) => { const d = el('lv', { left: x(p[0]) + 'px', top: lvY(p[1]) + 'px' }, `The ${key} at level ${num(p[1])} here (1 is as mixed). Drag up or down, or sideways. Double-click to remove this point.`); d.dataset.i = i; });
}
const saveCurve = async pts => { try { S = (await api('/curve', { layer: curveLayer(), points: pts })).state; audioRev = -1; } catch (e) { toast(e.message, true); } curveEdit = null; build(); };
track.addEventListener('dblclick', e => {
  const key = curveLayer(); if (!key) return;
  const pts = ((S.levels || {})[key] || []).map(p => [...p]);
  if (e.target.classList.contains('lv')) { pts.splice(+e.target.dataset.i, 1); return saveCurve(pts); }
  const yy = e.clientY - track.getBoundingClientRect().top;
  if (Math.abs(yy - waveY) > WAVE / 2 + 4 || e.target.closest('[data-key],.turn,.pin')) return;
  pts.push([Math.round(stepAt(e)), 1]); saveCurve(pts);
});
// ---- takes ---------------------------------------------------------------------------------------
function showTakes(list) {
  const box = $('takelist'), r = $('takes').getBoundingClientRect();
  box.innerHTML = list.map(t => `<div class="${t.here ? 'here' : ''}" data-name="${t.name.replace(/"/g, '&quot;')}" title="${t.here ? 'This is the show as it stands now.' : 'Switch the whole show to this take. Undo brings you back.'}\nKept ${t.at}"><span></span><b title="Throw this take away">\u00d7</b></div>`).join('') + '<input placeholder="name this take" title="Keep the show as it stands now under this name. Enter keeps it.">';
  box.querySelectorAll('div').forEach((d, i) => d.querySelector('span').textContent = list[i].name);
  box.style.display = 'flex'; box.style.right = innerWidth - r.right + 'px'; box.style.bottom = innerHeight - r.top + 6 + 'px';
  box.querySelector('input').onkeydown = async e => { if (e.key === 'Enter' && e.target.value.trim()) takeDo({ save: e.target.value }); else if (e.key === 'Escape') box.style.display = 'none'; };
}
async function takeDo(body) {
  pause();
  try { const r = await api('/take', body); S = r.state; if (body.open) { dropFrames(0); pick = picked = null; } build(); showTakes(r.takes); } catch (e) { toast(e.message, true); }
}
$('takes').onclick = async () => { const box = $('takelist'); if (box.style.display === 'flex') return box.style.display = 'none'; try { showTakes(await api('/takes')); } catch (e) { toast(e.message, true); } };
$('takelist').addEventListener('click', e => { const d = e.target.closest('div[data-name]'); if (!d) return; if (e.target.tagName === 'B') takeDo({ drop: d.dataset.name }); else if (!d.classList.contains('here')) takeDo({ open: d.dataset.name }); });
addEventListener('pointerdown', e => { if (!e.target.closest('#takelist') && !e.target.closest('#takes')) $('takelist').style.display = 'none'; });
// ---- notes: M drops a pin at the playhead ------------------------------------------------------
let noting = null;
function openNote(n) { noting = n || {}; const i = $('note'); i.style.display = 'inline-block'; i.value = n ? n.text : ''; setTimeout(() => i.focus(), 0); }
$('note').addEventListener('keydown', async e => {
  if (e.key !== 'Enter' && e.key !== 'Escape') return;
  const i = $('note'), n = noting; i.style.display = 'none'; i.blur(); noting = null;
  if (e.key === 'Escape' || (!n.id && !i.value.trim())) return;
  try { S = (await api('/note', { f: F, text: i.value, id: n.id })).state; build(); } catch (err) { toast(err.message, true); }
});
async function openScene(dir) {
  pause();
  try { S = (await api('/open', { step: dir })).state; } catch (e) { return toast(e.message, true); }
  dropFrames(0); selected = null; pick = picked = null; marked = null; F = 0; fit(); build(); scroll.scrollLeft = 0;
}
$('prev').onclick = () => openScene(-1); $('next').onclick = () => openScene(1);
$('xray').onclick = () => { xray = !xray; $('xray').classList.toggle('on', xray); dropFrames(0); fill(); };


// ---- playback: audio is the clock; if the next frame is not ready, wait for it ---------------
let stopAt = null;
const now = () => muted ? clockBase + (performance.now() - clock0) / 1000 : audio.currentTime;
const seek = f => { clockBase = f / S.fps; clock0 = performance.now(); if (!muted) audio.currentTime = f / S.fps; };
async function ready(f) {
  const end = Math.min(f + 45, range[1]);
  for (;;) { let ok = true; for (let i = f; i < end; i++) if (!have(i)) { ok = false; break; } if (ok || !playing) return; await new Promise(r => setTimeout(r, 40)); }
}
async function play(fromRangeStart) {
  if (playing) return;
  playing = true; stopAt = null; $('play').innerHTML = ICON.pause;
  range = aud || (marked ? [frameOf(marked[0]), Math.min(S.total, frameOf(marked[1]))] : loop ? turnFrames(turnAt(F)) : [0, S.total]);
  if (fromRangeStart === true || F >= range[1] - 1) setF(range[0]);
  if (audioRev !== S.rev) {
    audioRev = S.rev;                      // fetched whole, so the browser can seek anywhere in it
    try {
      const blob = await (await fetch('/audio?rev=' + S.rev + hearQ())).blob();
      if (audio.src) URL.revokeObjectURL(audio.src);
      audio.src = URL.createObjectURL(blob);
      await new Promise(r => { audio.oncanplaythrough = r; audio.onerror = r; setTimeout(r, 1500); });
    } catch (e) {}
  }
  $('spin').style.display = 'block'; fill(); await ready(F); $('spin').style.display = 'none';
  if (!playing) return;
  seek(F);
  try { muted = false; await audio.play(); } catch (e) { muted = true; seek(F); }
  requestAnimationFrame(tick);
}
function pause() { if (!playing) return; playing = false; stalled = false; audio.pause(); $('play').innerHTML = ICON.play; $('spin').style.display = 'none'; paint(); }
function tick() {
  if (!playing || stalled) return;
  let f = Math.max(Math.floor(now() * S.fps + 0.001), range[0]);
  if (stopAt !== null && f >= stopAt) { pause(); return setF(Math.min(stopAt, S.total - 1)); }
  if (f >= range[1]) {
    if (aud) { pause(); setF(range[1] - 1); if (loop) audT = setTimeout(audition, 500); return; }
    if (!loop) { pause(); return setF(range[1] - 1); } f = range[0]; seek(f);
  }
  if (!have(f)) {
    stalled = true; audio.pause(); $('spin').style.display = 'block'; F = f; fill();
    return ready(f).then(() => { $('spin').style.display = 'none'; if (!playing) return; stalled = false; seek(f); if (!muted) audio.play().catch(() => { muted = true; seek(f); }); requestAnimationFrame(tick); });
  }
  if (f !== F) setF(f);
  requestAnimationFrame(tick);
}
const userPlay = () => { clearTimeout(audT); clearTimeout(replayT); stopBefore(); aud = null; playing ? pause() : play(); };   // playing by hand leaves the audition
$('play').onclick = userPlay;
$('loop').onclick = () => { loop = !loop; $('loop').classList.toggle('on', loop); if (!loop) clearTimeout(audT); if (playing && !aud) { pause(); play(); } };

// ---- view: wheel scrolls the timeline, Ctrl/Cmd+wheel (or pinch) zooms about the pointer ------
const fit = () => { pps = Math.max(2, (scroll.clientWidth - 2 * PAD) / S.steps); };
scroll.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const mx = e.clientX - scroll.getBoundingClientRect().left, s = (mx + scroll.scrollLeft - PAD) / pps;
    pps = Math.min(Math.max(pps * Math.exp(-e.deltaY * 0.004), Math.min(2, (scroll.clientWidth - 2 * PAD) / S.steps)), 120);
    build(); scroll.scrollLeft = x(s) - mx; drawRuler();
  } else scroll.scrollLeft += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
}, { passive: false });
scroll.addEventListener('scroll', drawRuler);
addEventListener('resize', drawRuler);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && !(e.ctrlKey || e.metaKey)) { if (e.key === 'Escape') e.target.blur(); return; }
  const mod = e.ctrlKey || e.metaKey, k = e.key, low = k.toLowerCase();
  if (k === ' ') userPlay();
  else if (k === 'Enter' && pick) audition();
  else if (low === 'b' && pick) flip();
  else if (mod && low === 'z') step(e.shiftKey ? 'redo' : 'undo');
  else if (low === 'l') $('loop').click();
  else if (low === 'm' && !mod) { pause(); openNote(); }
  else if (low === 'h' && !mod) $('hear').click();
  else if (low === 'x') $('xray').click();
  else if (k === '[') openScene(-1);
  else if (k === ']') openScene(1);
  else if ((k === 'ArrowUp' || k === 'ArrowDown') && S.card) {      // on a card, the music's level
    const m = S.card.music; if (m) commit(['card', 'music_vol'], m.vol, Math.min(2, Math.max(0, Math.round((m.vol + (k === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 0.01 : 0.05)) * 100) / 100)));
  }
  else if (k === 'ArrowUp' || k === 'ArrowDown') {        // nudge the picked value; with nothing picked, pick whatever owns this moment
    if (!pick) { const o = ownerAt(F); if (o) { pause(); pickAt(o.address); } }
    else bump(k === 'ArrowUp' ? 1 : -1, e.shiftKey);
  }
  else if (k === 'Tab') tab(e.shiftKey ? -1 : 1);
  else if (k === '/') openFind();
  else if ((k === 'Backspace' || k === 'Delete') && pick) nudge('reset');
  else if (low === 'w' && pick && picked && picked.wider) nudge('widen');
  else if (k === 'Escape' && !pick && marked) { marked = null; showMark(); }
  else if (k === 'Escape' && pick) { clearTimeout(audT); clearTimeout(replayT); stopBefore(); aud = null; pickAt(null); }
  else if ((k === 'ArrowLeft' || k === 'ArrowRight') && e.altKey) {
    const d = showSel(); if (!d) return; const v = Math.min(Math.max(d._m.value + (k === 'ArrowLeft' ? -0.25 : 0.25), d._m.lo), d._m.hi);
    commit(d._m.path, d._m.value, v);
  }
  else if (k === 'ArrowLeft' || k === 'ArrowRight') { pause(); const dir = k === 'ArrowLeft' ? -1 : 1; setF(e.shiftKey ? frameOf(Math.round(stepsOf(F)) + dir) : F + dir); }
  else if (k === 'Home') { pause(); setF(0); }
  else if (k === 'End') { pause(); setF(S.total - 1); }
  else return;
  e.preventDefault();
});

setInterval(async () => {                                // follow the files: pick up changes made elsewhere
  if (!S || drag || sending || nudging) return;
  try {
    const r = await api('/poll');
    if (drag || sending || nudging) return;
    if (r.rev !== S.rev) { S = await api('/state'); dropFrames(0); build(); if (pick) pickAt(pick, true); }
    else if (r.info_rev !== S.info_rev) { S = await api('/state'); build(); }
  } catch (e) {}
}, 500);

(async () => {
  S = await api('/state');
  view.width = S.width; view.height = S.height; view.style.aspectRatio = S.width + '/' + S.height;
  $('play').innerHTML = ICON.play; showHear();
  fit(); build(); window._ready = true;
})();
</script>
</body>
