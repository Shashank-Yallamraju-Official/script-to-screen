name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core libegl1 libgl1
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pip install ruff && ruff check script_to_screen --select F
      - run: s2s check --show shows/demo
      - run: s2s check --show shows/crown
