<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toon</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0f1011; --panel:#16171a; --raise:#1d1f23; --line:#292b30; --text:#d0d6e0; --mute:#7f8590; --accent:#6e79d6; --warn:#e5a13a; --bad:#e5534b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font: 12px/1.3 Inter, -apple-system, "Segoe UI", system-ui, sans-serif; user-select: none; overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; }
  #stage { flex: 1; min-height: 120px; display: flex; align-items: center; justify-content: center; padding: 14px; position: relative; }
  #view { max-width: 100%; max-height: 100%; border-radius: 6px; background: #000; box-shadow: 0 8px 30px #0008; }
  #spin { position: absolute; width: 26px; height: 26px; border: 2px solid #0003; border-top-color: #000; border-radius: 50%; animation: sp .7s linear infinite; display: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #bar { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); }
  #why { flex: 1; min-width: 0; padding: 0 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { all: unset; width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 6px; color: var(--mute); cursor: pointer; position: relative; }
  button:hover { background: var(--raise); color: var(--text); }
  button.on { color: var(--accent); }
  button:disabled { opacity: .3; pointer-events: none; }
  button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #play { color: var(--text); }
  #save.dirty::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
  #flag { display: none; color: var(--warn); } #flag.bad { color: var(--bad); }
  .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; flex: none; }
  #tc { font: 500 12px ui-monospace, "SF Mono", Menlo, monospace; padding: 0 8px; min-width: 76px; flex: none; }
  #sel { display: none; align-items: center; gap: 6px; padding: 2px 4px 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); flex: none; }
  #sel i { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
  #sel input { all: unset; width: 44px; font: 500 12px ui-monospace, Menlo, monospace; color: var(--text); text-align: right; user-select: text; }
  #ledger { display: flex; gap: 10px; padding: 0 8px; flex: none; }
  .led { display: flex; align-items: center; gap: 5px; } .led > i { width: 9px; height: 9px; border-radius: 50%; }
  .pips { display: flex; gap: 2px; } .pips u { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid; box-sizing: border-box; }
  #tl { display: flex; background: var(--panel); }
  #gutter { width: 34px; flex: none; position: relative; border-right: 1px solid var(--line); }
  #gutter div { position: absolute; left: 0; width: 100%; display: grid; place-items: center; color: var(--mute); }
  #gutter svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #gutter i { width: 9px; height: 9px; border-radius: 50%; }
  #scroll { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; }
  #track { position: relative; }
  #ruler { position: sticky; left: 0; top: 0; display: block; cursor: ew-resize; z-index: 4; }
  .turn { position: absolute; height: 24px; background: var(--raise); border: 1px solid var(--line); border-radius: 5px; color: var(--mute); padding: 4px 7px; font-weight: 500; overflow: hidden; }
  .turn.cur { border-color: #3d4050; color: var(--text); }
  .grip { position: absolute; top: 0; right: 0; width: 8px; height: 100%; cursor: col-resize; }
  .grip::after { content: ""; position: absolute; right: 2px; top: 5px; bottom: 5px; width: 2px; border-radius: 1px; background: var(--line); }
  .grip:hover::after, .grip.sel::after { background: var(--accent); }
  .cut { position: absolute; width: 1px; background: var(--line); pointer-events: none; }
  .felt { position: absolute; height: 14px; margin-top: -7px; border-radius: 4px; display: flex; align-items: center; padding-left: 5px; overflow: hidden; }
  .say { position: absolute; height: 20px; margin-top: -10px; border-radius: 6px; cursor: ew-resize; overflow: hidden; z-index: 2; }
  .say b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px 0 0 6px; }
  .say span { position: absolute; left: 18px; right: 6px; top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #111; font-weight: 500; font-size: 11px; pointer-events: none; }
  .say u { position: absolute; left: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff9; pointer-events: none; }
  .sel { outline: 2px solid #fff; outline-offset: 1px; }
  #head { position: absolute; top: 0; width: 1px; background: var(--accent); pointer-events: none; z-index: 5; }
  #toast { position: fixed; right: 14px; bottom: 14px; padding: 8px 12px; border-radius: 8px; background: var(--raise); border: 1px solid var(--line); display: none; cursor: pointer; max-width: 60vw; white-space: pre-line; }
  #toast.bad { border-color: var(--bad); color: var(--bad); }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="view" width="1280" height="720"></canvas><div id="spin"></div></div>
  <div id="bar">
    <button id="prev"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
    <button id="next"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
    <span class="sep"></span>
    <button id="play" title="Play or pause (Space)"></button>
    <button id="loop" title="Loop the current turn (L)"><svg viewBox="0 0 16 16"><path d="M3 7V6a2 2 0 0 1 2-2h7M10 2l2 2-2 2M13 9v1a2 2 0 0 1-2 2H4M6 14l-2-2 2-2"/></svg></button>
    <button id="xray" title="X-ray (X): the director's view. Everything below the ground line is for you, not the audience. The bar is an entity's weight in the room. Ringed pips are what it feels; filled pips are what shows."><svg viewBox="0 0 16 16"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg></button>
    <span id="tc" title="Turn · frame within the turn. Arrow keys step one frame, Shift+arrow ten."></span>
    <div id="sel" title="Frames for the selected timing. Type a number, or Alt+arrow to nudge."><i></i><input id="selv" type="number"></div>
    <span id="why" title="Why this turn happens"></span>
    <div id="ledger"></div>
    <button id="flag"><svg viewBox="0 0 16 16"><path d="M8 2.5 14.5 13h-13zM8 7v3M8 11.6v.1"/></svg></button>
    <span class="sep"></span>
    <button id="undo" title="Undo (Ctrl/Cmd+Z)"><svg viewBox="0 0 16 16"><path d="M5 3 2 6l3 3M2 6h7a4 4 0 0 1 0 8H6"/></svg></button>
    <button id="redo" title="Redo (Ctrl/Cmd+Shift+Z)"><svg viewBox="0 0 16 16"><path d="m11 3 3 3-3 3M14 6H7a4 4 0 0 0 0 8h3"/></svg></button>
    <button id="save" title="Save to the scene file (Ctrl/Cmd+S)"><svg viewBox="0 0 16 16"><path d="M3 2h8l3 3v9H3zM5 2v4h5V2M5 14v-4h6v4"/></svg></button>
    <button id="render"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 3v10M11 3v10M2 6h3M2 10h3M11 6h3M11 10h3"/></svg></button>
  </div>
  <div id="tl">
    <div id="gutter"></div>
    <div id="scroll"><div id="track"><canvas id="ruler"></canvas><div id="head"></div></div></div>
  </div>
</div>
<div id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const view = $('view'), ctx = view.getContext('2d'), scroll = $('scroll'), track = $('track'), ruler = $('ruler');
const PAD = 14, RULER = 24, ROW = 26;
const ICON = {
  play: '<svg viewBox="0 0 16 16"><path d="M5 3v10l8-5z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 16 16"><path d="M5 3v10M11 3v10" stroke-width="2.4"/></svg>',
  turns: '<svg viewBox="0 0 16 16"><rect x="2" y="4" width="5" height="8" rx="1"/><rect x="9" y="4" width="5" height="8" rx="1"/></svg>',
  say: '<svg viewBox="0 0 16 16"><path d="M3 3h10v7H8l-3 3v-3H3z"/></svg>',
};
let S = null, F = 0, ppf = 3, playing = false, loop = false, stalled = false, xray = false;
let frames = new Map(), selected = null, drag = null, undo = [], redo = [];
let audio = new Audio(), audioRev = -1, muted = false, clock0 = 0, clockBase = 0, range = [0, 0];

const api = async (path, body) => {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const toast = (msg, bad, onclick) => {
  const t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block'; t.onclick = onclick || null;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', bad ? 8000 : 5000);
};
const x = f => PAD + f * ppf;
const turnAt = f => S.turns.find(t => f >= t.start && f < t.start + t.length) || S.turns[S.turns.length - 1];
const el = (cls, style, title) => { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, style); if (title) d.title = title; track.appendChild(d); return d; };
const pips = (n, filled, color) => `<span class="pips">${Array.from({ length: n }, (_, i) => `<u style="border-color:${color};background:${i < filled ? color : 'none'}"></u>`).join('')}</span>`;

// ---- frames: the server renders, the browser keeps what it has seen --------------------------
const loadImg = (f, full, rev) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = `/frame?f=${f}&rev=${rev}&full=${full ? 1 : 0}&xray=${xray ? 1 : 0}`; });
function nextNeeded() {
  if (!frames.has(F)) return F;
  const end = playing ? range[1] : Math.min(S.total, F + 1500);
  for (let f = F + 1; f < end; f++) if (!frames.has(f)) return f;
  for (let f = playing ? range[0] : Math.max(0, F - 90); f < F; f++) if (!frames.has(f)) return f;
  return -1;
}
let pumping = false, epoch = 0;
async function pump() {
  if (pumping) return; pumping = true;
  for (;;) {
    const e = epoch, rev = S.rev, f = nextNeeded();
    if (f < 0) break;
    try { const img = await loadImg(f, false, rev); if (e === epoch && rev === S.rev) { frames.set(f, img); if (f === F && !playing) paint(); drawRuler(); } }
    catch (err) { await new Promise(r => setTimeout(r, 300)); }
  }
  pumping = false;
}
const dropFrames = from => { epoch++; for (const f of [...frames.keys()]) if (f >= from) frames.delete(f); };
let sharpT = 0;
function paint() {
  const img = frames.get(F);
  if (img) ctx.drawImage(img, 0, 0, view.width, view.height);
  clearTimeout(sharpT);
  if (!playing) sharpT = setTimeout(async () => {          // once you stop on a frame, show it at full quality
    const f = F, e = epoch, rev = S.rev;
    try { const full = await loadImg(f, true, rev); if (f === F && e === epoch && rev === S.rev && !playing) ctx.drawImage(full, 0, 0, view.width, view.height); } catch (err) {}
  }, 140);
}
function setF(f, keepView) {
  F = Math.min(Math.max(Math.round(f), 0), S.total - 1);
  const t = turnAt(F);
  $('tc').textContent = `T${t.id} · ${String(F - t.start).padStart(3, '0')}`;
  $('why').textContent = t.why;
  $('head').style.left = x(F) + 'px';
  document.querySelectorAll('.turn').forEach(d => d.classList.toggle('cur', d.dataset.id == t.id));
  if (!keepView) { const px = x(F) - scroll.scrollLeft; if (px < 30 || px > scroll.clientWidth - 30) scroll.scrollLeft = x(F) - scroll.clientWidth * (playing ? 0.15 : 0.5); }
  paint(); drawRuler(); pump();
}

// ---- timeline --------------------------------------------------------------------------------
function build() {
  const lanes = [['turns', ICON.turns, 'Turns: hover one to read why it happens. Drag its right edge to change how long it holds.'],
    ...S.entities.map(e => [e.id, `<i style="background:${e.color}"></i>`, `${e.id}${e.kind ? ' (' + e.kind + ')' : ''}: what it feels. Filled pips show; hollow pips are held in.`]),
    ['say', ICON.say, 'Lines: drag one to change the pause before it starts.']];
  const y = {}; lanes.forEach((l, i) => y[l[0]] = RULER + 8 + i * ROW + ROW / 2);
  const H = RULER + 8 + lanes.length * ROW + 8;
  $('gutter').innerHTML = lanes.map(l => `<div style="top:${y[l[0]] - ROW / 2}px;height:${ROW}px" title="${l[2]}">${l[1]}</div>`).join('');
  $('gutter').style.height = H + 'px';
  track.querySelectorAll('.turn,.cut,.felt,.say').forEach(d => d.remove());
  track.style.width = x(S.total) + PAD + 'px'; track.style.height = H + 'px'; $('head').style.height = H + 'px';
  const mark = (d, path, lo, hi, value, color) => { d.dataset.key = JSON.stringify(path); d._m = { path, lo, hi, value, color }; if (selected === d.dataset.key) d.classList.add('sel'); };
  for (const t of S.turns) {
    const b = el('turn', { left: x(t.start) + 'px', top: y.turns - 12 + 'px', width: t.length * ppf - 2 + 'px' }, `Turn ${t.id} · ${(t.length / S.fps).toFixed(2)}s\n${t.why}`);
    b.textContent = t.id; b.dataset.id = t.id;
    const g = document.createElement('div'); g.className = 'grip'; g.title = `Hold: ${t.hold} frames after the turn finishes. Drag to change.`; b.appendChild(g);
    mark(g, t.paths.hold, 0, 900, t.hold, '#6e79d6');
    if (t.start) el('cut', { left: x(t.start) - 1 + 'px', top: RULER + 'px', height: H - RULER + 'px' });
    for (const [e, segs] of Object.entries(t.lanes)) segs.forEach((s, j) => {
      if (!s.felt) return;
      const to = j + 1 < segs.length ? segs[j + 1].at : t.length, c = S.emotions[s.felt] || '#888';
      const d = el('felt', { left: x(t.start + s.at) + 'px', top: y[e] + 'px', width: Math.max((to - s.at) * ppf - 1, 4) + 'px', background: c + '33' }, s.tip);
      d.innerHTML = pips(Math.max(s.intensity, s.level), s.level, c);
    });
    if (t.say) {
      const q = t.say, c = S.entities.find(e => e.id === q.who).color;
      const d = el('say', { left: x(t.start + q.at) + 'px', top: y.say + 'px', width: Math.max((t.length - q.at) * ppf - 2, 10) + 'px', background: c + '66' },
        `${q.who} (${q.tone}): ${q.text}\nStarts after a pause of ${t.pause} frames` + (q.latency ? `, plus ${q.latency} of hesitation from what ${q.who} feels` : ''));
      d.innerHTML = `<b style="width:${q.reveal * ppf}px;background:${c}"></b><u style="background:${q.tone_color}"></u><span></span>`;
      d.querySelector('span').textContent = q.text;
      mark(d, t.paths.pause, 0, 600, t.pause, c);
    }
  }
  $('save').classList.toggle('dirty', S.dirty);
  $('render').disabled = S.dirty; $('render').title = S.dirty ? 'Save first, then render to video' : 'Render the saved scene to video';
  $('undo').disabled = !undo.length; $('redo').disabled = !redo.length;
  const where = `Scene ${S.index + 1} of ${S.count}: ${S.title} (${S.file})`;
  $('prev').title = 'Previous scene ([)\n' + where; $('next').title = 'Next scene (])\n' + where;
  $('prev').disabled = $('next').disabled = S.count < 2;
  const flag = $('flag'); flag.style.display = S.problems.length ? 'grid' : 'none';
  flag.className = S.problems.some(p => p.level === 'error') ? 'bad' : '';
  flag.title = S.problems.map(p => (p.turn != null ? `Turn ${p.turn}: ` : '') + p.msg).join('\n') + (flag.className ? '\nErrors stop the scene from rendering.' : '');
  $('ledger').innerHTML = S.entities.filter(e => S.ledger[e.id]).map(e => `<span class="led"><i style="background:${e.color}" title="${e.id}: what the audience has had the chance to learn"></i>` +
    Object.entries(S.ledger[e.id]).map(([emo, c]) => `<span title="${e.id} · ${emo}: shown in ${c.seen} of the ${c.need} scenes needed${c.positions.length ? ' (' + c.positions.join(', ') + ')' : ''}. ${c.learned ? 'The audience can read it now.' : 'Not learned yet.'}${c.hidden ? ` Felt but hidden in ${c.hidden}.` : ''}">${pips(c.need, c.seen, S.emotions[emo] || '#888')}</span>`).join('') + '</span>').join('');
  document.title = (S.dirty ? '• ' : '') + S.title;
  showSel();
  setF(Math.min(F, S.total - 1), true);
}
function drawRuler() {
  const w = scroll.clientWidth, dpr = devicePixelRatio || 1, g = ruler.getContext('2d');
  if (ruler.width !== w * dpr) { ruler.width = w * dpr; ruler.height = RULER * dpr; ruler.style.width = w + 'px'; ruler.style.height = RULER + 'px'; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, RULER); g.fillStyle = '#16171a'; g.fillRect(0, 0, w, RULER);
  const off = scroll.scrollLeft, step = [1, 5, 10, 15, 30, 60, 150, 300, 900, 1800].find(s => s * ppf >= 56) || 3600;
  g.font = '10px Inter, system-ui, sans-serif'; g.fillStyle = '#7f8590'; g.strokeStyle = '#292b30'; g.beginPath();
  for (let f = Math.max(0, Math.floor((off - PAD) / ppf / step) * step); x(f) - off < w && f <= S.total; f += step) {
    const px = Math.round(x(f) - off) + .5; g.moveTo(px, 15); g.lineTo(px, RULER);
    g.fillText(step < S.fps ? f : (f / S.fps) + 's', px + 3, 12);
  }
  g.stroke();
  g.fillStyle = '#6e79d688';                                  // which frames are ready to play
  let a = -1;
  for (let f = Math.max(0, Math.floor((off - PAD) / ppf)); f <= S.total; f++) {
    const has = f < S.total && frames.has(f);
    if (has && a < 0) a = f;
    if (!has && a >= 0) { g.fillRect(x(a) - off, RULER - 2, (f - a) * ppf, 2); a = -1; }
    if (x(f) - off > w) break;
  }
  g.fillStyle = '#6e79d6'; const hx = x(F) - off; g.beginPath(); g.moveTo(hx - 5, 0); g.lineTo(hx + 5.5, 0); g.lineTo(hx + .5, 7); g.fill();
}

// ---- editing ---------------------------------------------------------------------------------
let sending = false, queued = null;
async function patch(path, value) {
  queued = { path, value };
  if (sending) return;
  sending = true;
  while (queued) {
    const op = queued; queued = null;
    try { const r = await api('/patch', { ops: [op] }); dropFrames(r.dirty_from); S = r.state; build(); }
    catch (e) { toast(e.message, true); }
  }
  sending = false;
}
function commit(m, before, after) { if (before !== after) { undo.push({ path: m.path, before, after }); redo = []; } }
function showSel() {
  const d = selected && [...track.querySelectorAll('[data-key]')].find(d => d.dataset.key === selected);
  $('sel').style.display = d ? 'flex' : 'none';
  if (d) { $('sel').querySelector('i').style.background = d._m.color; if (document.activeElement !== $('selv')) $('selv').value = d._m.value; }
  return d;
}
track.addEventListener('pointerdown', e => {
  const d = e.target.closest('[data-key]');
  if (d) {
    const was = playing; pause();
    selected = d.dataset.key; track.querySelectorAll('[data-key]').forEach(n => n.classList.toggle('sel', n.dataset.key === selected));
    showSel();
    drag = { m: d._m, x0: e.clientX, start: d._m.value, last: d._m.value, was };
  } else {
    pause(); selected = null; track.querySelectorAll('.sel').forEach(n => n.classList.remove('sel')); showSel();
    drag = { scrub: true }; scrubTo(e);
  }
  e.preventDefault();
});
const scrubTo = e => setF((e.clientX - scroll.getBoundingClientRect().left + scroll.scrollLeft - PAD) / ppf, true);
addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.scrub) return scrubTo(e);
  const v = Math.min(Math.max(drag.start + Math.round((e.clientX - drag.x0) / ppf), drag.m.lo), drag.m.hi);
  if (v !== drag.last) { drag.last = v; patch(drag.m.path, v); }
});
addEventListener('pointerup', async () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.scrub) return;
  commit(d.m, d.start, d.last);
  while (sending) await new Promise(r => setTimeout(r, 20));
  build();
  if (d.was && d.start !== d.last) play(true);
});
$('selv').addEventListener('change', () => { const d = showSel(); if (!d) return; const v = Math.min(Math.max(+$('selv').value | 0, d._m.lo), d._m.hi); commit(d._m, d._m.value, v); patch(d._m.path, v); $('selv').blur(); });
async function step(from, to) {
  const op = from.pop(); if (!op) return;
  pause(); to.push(op); selected = JSON.stringify(op.path);
  await patch(op.path, from === undo ? op.before : op.after);
}
$('undo').onclick = () => step(undo, redo); $('redo').onclick = () => step(redo, undo);
$('save').onclick = async () => { try { S = (await api('/save', {})).state; build(); toast('Saved ' + S.file); } catch (e) { toast(e.message, true); } };
$('render').onclick = async () => {
  pause(); $('spin').style.display = 'block'; $('render').disabled = true;
  try { const r = await api('/render', {}); toast('Rendered ' + r.file + '\nClick to open.', false, () => open('/video?t=' + Date.now())); } catch (e) { toast(e.message, true); }
  $('spin').style.display = 'none'; $('render').disabled = S.dirty;
};
async function openScene(dir) {
  pause();
  try { S = (await api('/open', { step: dir })).state; } catch (e) { return toast(e.message, true); }
  dropFrames(0); undo = []; redo = []; selected = null; F = 0; fit(); build(); scroll.scrollLeft = 0;
}
$('prev').onclick = () => openScene(-1); $('next').onclick = () => openScene(1);
$('xray').onclick = () => { xray = !xray; $('xray').classList.toggle('on', xray); dropFrames(0); pump(); };

// ---- playback: audio is the clock; if the next frame is not ready, wait for it ---------------
const now = () => muted ? clockBase + (performance.now() - clock0) / 1000 : audio.currentTime;
const seek = f => { clockBase = f / S.fps; clock0 = performance.now(); if (!muted) audio.currentTime = f / S.fps; };
async function ready(f) {
  const end = Math.min(f + 24, range[1]);
  for (;;) { let ok = true; for (let i = f; i < end; i++) if (!frames.has(i)) { ok = false; break; } if (ok || !playing) return; await new Promise(r => setTimeout(r, 40)); }
}
async function play(fromRangeStart) {
  if (playing) return;
  playing = true; $('play').innerHTML = ICON.pause;
  const t = turnAt(F); range = loop ? [t.start, t.start + t.length] : [0, S.total];
  if (fromRangeStart === true || F >= range[1] - 1) setF(range[0]);
  if (audioRev !== S.rev) {
    audioRev = S.rev;                      // fetched whole, so the browser can seek anywhere in it
    try {
      const blob = await (await fetch('/audio?rev=' + S.rev)).blob();
      if (audio.src) URL.revokeObjectURL(audio.src);
      audio.src = URL.createObjectURL(blob);
      await new Promise(r => { audio.oncanplaythrough = r; audio.onerror = r; setTimeout(r, 1500); });
    } catch (e) {}
  }
  $('spin').style.display = 'block'; pump(); await ready(F); $('spin').style.display = 'none';
  if (!playing) return;
  seek(F);
  try { muted = false; await audio.play(); } catch (e) { muted = true; seek(F); }
  requestAnimationFrame(tick);
}
function pause() { if (!playing) return; playing = false; stalled = false; audio.pause(); $('play').innerHTML = ICON.play; $('spin').style.display = 'none'; paint(); }
function tick() {
  if (!playing || stalled) return;
  let f = Math.max(Math.floor(now() * S.fps + 0.001), range[0]);
  if (f >= range[1]) { if (!loop) { pause(); return setF(range[1] - 1); } f = range[0]; seek(f); }
  if (!frames.has(f)) {
    stalled = true; audio.pause(); $('spin').style.display = 'block'; F = f; pump();
    return ready(f).then(() => { $('spin').style.display = 'none'; if (!playing) return; stalled = false; seek(f); if (!muted) audio.play().catch(() => { muted = true; seek(f); }); requestAnimationFrame(tick); });
  }
  if (f !== F) setF(f);
  requestAnimationFrame(tick);
}
$('play').onclick = () => playing ? pause() : play();
$('loop').onclick = () => { loop = !loop; $('loop').classList.toggle('on', loop); if (playing) { pause(); play(); } };

// ---- view: wheel scrolls the timeline, Ctrl/Cmd+wheel (or pinch) zooms about the pointer ------
const fit = () => { ppf = Math.max(1, (scroll.clientWidth - 2 * PAD) / S.total); };
scroll.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {
    const mx = e.clientX - scroll.getBoundingClientRect().left, f = (mx + scroll.scrollLeft - PAD) / ppf;
    ppf = Math.min(Math.max(ppf * Math.exp(-e.deltaY * 0.004), Math.min(1, (scroll.clientWidth - 2 * PAD) / S.total)), 28);
    build(); scroll.scrollLeft = x(f) - mx; drawRuler();
  } else scroll.scrollLeft += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
}, { passive: false });
scroll.addEventListener('scroll', drawRuler);
addEventListener('resize', drawRuler);
addEventListener('keydown', e => {
  if (e.target === $('selv') && !(e.ctrlKey || e.metaKey)) { if (e.key === 'Escape') $('selv').blur(); return; }
  const mod = e.ctrlKey || e.metaKey, k = e.key, low = k.toLowerCase();
  if (k === ' ') { playing ? pause() : play(); }
  else if (mod && low === 's') $('save').click();
  else if (mod && low === 'z') step(e.shiftKey ? redo : undo, e.shiftKey ? undo : redo);
  else if (low === 'l') $('loop').click();
  else if (low === 'x') $('xray').click();
  else if (k === '[') openScene(-1);
  else if (k === ']') openScene(1);
  else if ((k === 'ArrowLeft' || k === 'ArrowRight') && e.altKey) {
    const d = showSel(); if (!d) return; const v = Math.min(Math.max(d._m.value + (k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 5 : 1), d._m.lo), d._m.hi);
    commit(d._m, d._m.value, v); patch(d._m.path, v);
  }
  else if (k === 'ArrowLeft' || k === 'ArrowRight') { pause(); setF(F + (k === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 10 : 1)); }
  else if (k === 'Home') { pause(); setF(0); }
  else if (k === 'End') { pause(); setF(S.total - 1); }
  else return;
  e.preventDefault();
});
addEventListener('beforeunload', e => { if (S && S.dirty) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  S = await api('/state');
  view.width = S.width; view.height = S.height; view.style.aspectRatio = S.width + '/' + S.height;
  $('play').innerHTML = ICON.play;
  fit(); build(); window._ready = true;
})();
</script>
</body>
