# A turn changes as little as possible and says why. Everything else holds.
#   enter / exit   who is present, and at which of the nine slots (0 left .. 8 right)
#   side, status   who stands with whom, and how much standing they have
#   do             a deliberate action: slot, move, orient, attention, posture
#   who, say       the speaker and the line; the tone comes from what the speaker feels
#   feel           what the turn makes entities feel: {entity: {emotion: 1-3}} or {entity: calm}
#   pause, hold    frames before the line and after the turn (tune these in the editor)
scene: The last dumpling
turns:
  - id: 1
    enter: {juno: {slot: 2}, otis: {slot: 5}}
    why: Two entities share a room at social distance, both facing out. Nothing has happened yet.

  - id: 2
    who: juno
    do: {juno: {orient: otis}}
    say: Someone ate the last dumpling.
    feel: {juno: {joy: 1}, otis: {shame: 2}}
    why: She already knows, and enjoys knowing. He hears it and knows he is caught.

  - id: 3
    who: otis
    say: It was like that when I got here.
    why: The lie. He does not turn to her, because facing her would be answering her.

  - id: 4
    who: juno
    do: {juno: {move: {toward: otis, zone: personal}}}
    say: There's sauce on your chin.
    feel: {otis: {shame: 3}}
    why: She closes the distance to apply pressure, then gives the proof.

  - id: 5
    why: Nobody speaks. The silence is the verdict.
    hold: 45
